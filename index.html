<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Моё первое приложение</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background: #f1eaff;
			text-align: center;
			padding: 50px 20px;
		}

		.app {
			background: white;
			padding: 30px;
			border-radius: 20px;
			max-width: 350px;
			margin: auto;
		}

		h1 {
			color: #7652a8;
		}

		button {
			background: #7652a8;
			color: white;
			border: none;
			padding: 15px 25px;
			border-radius: 10px;
			font-size: 16px;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<div class="app">
		<h1>Моё первое приложение</h1>
		<button onclick="alert('У меня получилось!')">
			Нажми на меня
		</button>
	</div>
</body>
</html>
